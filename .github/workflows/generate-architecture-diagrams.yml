name: Generate architecture diagrams once

on:
  push:
    branches:
      - docs/excalidraw-architecture-visuals

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the documentation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore the one-shot diagram generator
        shell: bash
        run: |
          set -euo pipefail
          cat tools/diagram-generator.part-* | base64 --decode | xz --decompress > tools/generate_architecture_diagrams.py

      - name: Generate editable Excalidraw sources and SVG previews
        run: python3 tools/generate_architecture_diagrams.py

      - name: Normalize filenames and remove the one-shot bootstrap
        shell: bash
        run: |
          set -euo pipefail
          mv docs/diagrams/nano-aural-runtime-system-overview.excalidraw docs/diagrams/system-overview.excalidraw
          mv docs/diagrams/nano-aural-runtime-system-overview.svg docs/diagrams/system-overview.svg
          mv docs/diagrams/nano-aural-runtime-core-architecture.excalidraw docs/diagrams/runtime-core.excalidraw
          mv docs/diagrams/nano-aural-runtime-core-architecture.svg docs/diagrams/runtime-core.svg
          mv docs/diagrams/nano-aural-runtime-durable-execution.excalidraw docs/diagrams/durable-execution.excalidraw
          mv docs/diagrams/nano-aural-runtime-durable-execution.svg docs/diagrams/durable-execution.svg
          mv docs/diagrams/nano-aural-runtime-executive-one-pager.excalidraw docs/diagrams/executive-one-pager.excalidraw
          mv docs/diagrams/nano-aural-runtime-executive-one-pager.svg docs/diagrams/executive-one-pager.svg
          rm tools/generate_architecture_diagrams.py
          rm tools/diagram-generator.part-*
          rm .github/workflows/generate-architecture-diagrams.yml

      - name: Commit the generated documentation assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/diagrams
          git add -u .github/workflows tools/diagram-generator.part-*
          git commit -m "docs: add editable architecture and reporting diagrams [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
