name: Fallback P12-P14 resumable integration

on:
  push:
    branches:
      - automation/p12-p14-v5-fallback
    paths:
      - .github/workflows/p12-p14-v5-fallback.yml

permissions:
  actions: read
  contents: write
  models: read
  pull-requests: write

concurrency:
  group: p12-p14-v5-fallback
  cancel-in-progress: false

jobs:
  fallback-after-v4-exhaustion:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: dongyuan21/nanoAuralRuntime
      V4_BRANCH: feat/p12-p14-runtime-contracts-v4
      V4_WORKFLOW: Implement P12-P14 resumable integration
      V5_BRANCH: feat/p12-p14-runtime-contracts-v5
      READY_BRANCH: feat/p12-p14-runtime-contracts-ready
    steps:
      - name: Check out fallback controller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Wait until v4 succeeds or exhausts four attempts
        id: v4
        shell: bash
        run: |
          set -euo pipefail
          run_id=''
          for lookup in $(seq 1 80); do
            run_id=$(gh api "repos/$REPO/actions/runs?branch=$V4_BRANCH&event=push&per_page=100" \
              --jq --arg workflow "$V4_WORKFLOW" \
              '.workflow_runs | map(select(.name == $workflow)) | sort_by(.created_at) | last | .id // empty')
            if [ -n "$run_id" ]; then break; fi
            sleep 30
          done
          if [ -z "$run_id" ]; then
            echo 'v4 engineering run was not found' >&2
            exit 1
          fi

          for poll in $(seq 1 500); do
            payload=$(gh api "repos/$REPO/actions/runs/$run_id")
            status=$(jq -r '.status' <<<"$payload")
            conclusion=$(jq -r '.conclusion // ""' <<<"$payload")
            run_attempt=$(jq -r '.run_attempt' <<<"$payload")
            if [ "$status" = completed ] && [ "$conclusion" = success ]; then
              echo 'fallback=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$status" = completed ] && [ "$run_attempt" -ge 4 ]; then
              case "$conclusion" in
                failure|cancelled|timed_out|action_required|startup_failure|stale)
                  echo 'fallback=true' >> "$GITHUB_OUTPUT"
                  echo "v4 exhausted attempts with $conclusion" >&2
                  exit 0
                  ;;
              esac
            fi
            sleep 45
          done
          echo 'v4 did not reach a terminal success/exhausted state' >&2
          exit 1

      - name: Stop when v4 already succeeded
        if: steps.v4.outputs.fallback != 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh api -X DELETE "repos/$REPO/git/refs/heads/automation/p12-p14-v5-fallback" || true

      - name: Prepare resumable v5 branch and reviewed driver
        if: steps.v4.outputs.fallback == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$V4_BRANCH" feat/p12-p14-runtime-contracts-v2
          git checkout -B "$V5_BRANCH" "origin/$V4_BRANCH"
          git rm -f .github/workflows/implement-p12-p14-v4.yml 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore: start P12-P14 fallback integration'
          fi
          git push --force origin HEAD:"$V5_BRANCH"

          git show origin/feat/p12-p14-runtime-contracts-v2:.github/automation/p12_p14_engineer.py > /tmp/p12_p14_engineer.py
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/p12_p14_engineer.py')
          text = path.read_text(encoding='utf-8')
          old = 'time.sleep(float(retry_after) if retry_after else delay)'
          new = 'time.sleep(min(float(retry_after), 30.0) if retry_after else delay)'
          if text.count(old) != 1:
              raise SystemExit('reviewed driver retry statement changed')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          chmod 0500 /tmp/p12_p14_engineer.py

          cat > /tmp/run_p12_p14_fallback.py <<'PY'
          from __future__ import annotations

          import importlib.util
          import os
          import subprocess
          from pathlib import Path

          root = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          branch = os.environ['V5_BRANCH']
          spec = importlib.util.spec_from_file_location('p12_p14_engineer', '/tmp/p12_p14_engineer.py')
          if spec is None or spec.loader is None:
              raise SystemExit('could not load reviewed engineering driver')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.ROOT = root
          module.AUTOMATION_PATHS = frozenset(
              set(module.AUTOMATION_PATHS)
              | {
                  '.github/workflows/implement-p12-p14-v4.yml',
                  '.github/workflows/p12-p14-v5-fallback.yml',
              }
          )

          completed = set(
              subprocess.run(
                  ['git', 'log', '--format=%s'],
                  cwd=root,
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout.splitlines()
          )
          module.PHASES = tuple(phase for phase in module.PHASES if phase.commit not in completed)
          original_commit_phase = module.commit_phase

          def commit_and_push(phase):
              sha = original_commit_phase(phase)
              subprocess.run(
                  ['git', 'push', 'origin', 'HEAD:' + branch],
                  cwd=root,
                  check=True,
                  timeout=300,
              )
              return sha

          module.commit_phase = commit_and_push
          raise SystemExit(module.main())
          PY

      - name: Set up Python 3.12
        if: steps.v4.outputs.fallback == 'true'
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.12'

      - name: Install development dependencies
        if: steps.v4.outputs.fallback == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'setuptools==82.0.1'
          python -m pip install --no-build-isolation -e '.[dev,postgres-test]'

      - name: Execute the fallback with remote phase checkpoints
        if: steps.v4.outputs.fallback == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NANO_AURAL_ENGINEERING_MODELS: openai/gpt-4.1-mini,openai/gpt-4.1
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/p12-p14-v5-fallback.log
          for attempt in 1 2 3; do
            echo "=== fallback engineering attempt $attempt ===" | tee -a /tmp/p12-p14-v5-fallback.log
            git fetch origin "$V5_BRANCH"
            git reset --hard "origin/$V5_BRANCH"
            git clean -fd
            if python /tmp/run_p12_p14_fallback.py 2>&1 | tee -a /tmp/p12-p14-v5-fallback.log; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 300; fi
          done
          exit 1

      - name: Run independent gate and publish canonical ready branch
        if: steps.v4.outputs.fallback == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff format --check .
          python -m ruff check .
          python -m pyright
          python -m pytest -q -m 'not gpu'
          test -f P12_P14_IMPLEMENTATION_REPORT.md
          test -f P12_P14_IMPLEMENTATION_REPORT.json
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore: publish clean fallback P12-P14 tree'
          fi
          test -z "$(git status --porcelain)"
          git push origin HEAD:"$V5_BRANCH"
          git push --force origin HEAD:"$READY_BRANCH"

      - name: Create canonical ready PR when absent
        if: steps.v4.outputs.fallback == 'true'
        shell: bash
        run: |
          set -euo pipefail
          existing=$(gh api "repos/$REPO/pulls?state=open&head=dongyuan21:$READY_BRANCH&base=main&per_page=10" --jq 'length')
          if [ "$existing" -eq 0 ]; then
            gh api -X POST "repos/$REPO/pulls" \
              -f title='feat: complete P12-P14 runtime contracts' \
              -f head="$READY_BRANCH" \
              -f base=main \
              -f body='Complete P12A-P14: stable artifact slots, bounded streaming publication, resumable uploads, persisted retry/session dispositions, canonical deployment seals, and concurrency admission. Full evidence is recorded in P12_P14_IMPLEMENTATION_REPORT.md and .json.' >/dev/null
          elif [ "$existing" -ne 1 ]; then
            echo 'unexpected number of canonical ready PRs' >&2
            exit 1
          fi

      - name: Remove fallback controller branch
        if: success() && steps.v4.outputs.fallback == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh api -X DELETE "repos/$REPO/git/refs/heads/automation/p12-p14-v5-fallback" || true

      - name: Upload fallback evidence
        if: always() && steps.v4.outputs.fallback == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: p12-p14-v5-fallback-log
          path: /tmp/p12-p14-v5-fallback.log
          if-no-files-found: warn
          retention-days: 3
