name: Fix recovery document anchors

on:
  push:
    branches:
      - fix/recovery-document-anchors

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/recovery-document-anchors
      - name: Align test anchors with Chinese operations documentation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_ops_reference.py')
          text = path.read_text(encoding='utf-8')
          old = '''    for phrase in (\n        "Upload stuck `VERIFYING`",\n        "Cancellation races",\n        "Reaper races",\n        "Mandatory dry run",\n        "canonical-blob deletion command",\n        "4090 smoke/recovery remain **DEFERRED**",\n        "Structured event fields",\n        "full-file download SHA-256",\n    ):\n'''
          new = '''    for phrase in (\n        "过期前上传卡在 `VERIFYING`",\n        "取消与执行/发布竞态",\n        "回收器与心跳竞态",\n        "Mandatory dry run",\n        "规范 blob 删除命令",\n        "4090 冒烟/恢复仍为 **DEFERRED**",\n        "结构化事件字段",\n        "全文件下载 SHA-256",\n    ):\n'''
          if text.count(old) != 1:
              raise SystemExit('expected recovery anchor block exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git rm .github/workflows/fix-recovery-document-anchors.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/test_ops_reference.py
          git commit -m "test: align recovery anchors with Chinese documentation"
          git push origin HEAD:fix/recovery-document-anchors
