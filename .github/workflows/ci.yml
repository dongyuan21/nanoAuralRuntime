name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-python:
    name: CPU / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CPU development dependencies
        run: |
          python -m pip install 'setuptools==82.0.1'
          python -m pip install --no-build-isolation -e '.[dev]'
      - name: Run CPU and per-version packaging/fresh-venv tests
        run: python -m pytest -q -m 'not gpu'

  static:
    name: Static and boundary checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - name: Install static tooling
        run: |
          python -m pip install 'setuptools==82.0.1'
          python -m pip install --no-build-isolation -e '.[dev]'
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m pyright
      - name: Run release and architecture boundary contracts
        run: >-
          python -m pytest -q
          tests/test_release_packaging.py
          tests/test_comfyui_removal.py
          tests/test_controlfoley_adapter.py
          tests/test_controlfoley_staged.py

  postgres-16:
    name: PostgreSQL 16 migrations and recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.3-bookworm@sha256:d0f363f8366fbc3f52d172c6e76bc27151c3d643b870e1062b4e8bfe65baf609
        env:
          POSTGRES_DB: ci_health
          POSTGRES_PASSWORD: ci-health-only
          POSTGRES_USER: ci_health
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_health -d ci_health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - name: Install PostgreSQL test dependencies
        run: |
          python -m pip install 'setuptools==82.0.1'
          python -m pip install --no-build-isolation -e '.[dev,postgres-test]'
      - name: Require PostgreSQL 16 local test binaries
        run: |
          test -x /usr/lib/postgresql/16/bin/initdb
          test -x /usr/lib/postgresql/16/bin/postgres
          test -x /usr/lib/postgresql/16/bin/pg_ctl
          test -x /usr/lib/postgresql/16/bin/pg_dump
          test -x /usr/lib/postgresql/16/bin/pg_restore
          test -x /usr/lib/postgresql/16/bin/psql
      - name: Run isolated PostgreSQL 16 and loopback suites
        env:
          NANO_AURAL_POSTGRES_BIN: /usr/lib/postgresql/16/bin
        run: >-
          python -m pytest -q
          tests/test_postgres_migration.py
          tests/test_release_migration_recovery.py
          tests/test_durable_service.py
          tests/test_publishing_worker_postgres.py

  docker-reference-conditional:
    name: Docker reference environment (explicit opt-in)
    if: github.event_name == 'workflow_dispatch' && vars.NANO_AURAL_RUN_DOCKER == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Create disposable CI-only secret files
        shell: bash
        run: |
          umask 077
          secret_dir="$RUNNER_TEMP/nano-aural-secrets"
          mkdir -p "$secret_dir"
          printf '%s\n' 'ci-migration-owner-password' > "$secret_dir/postgres_migration_password"
          printf '%s\n' 'ci-runtime-password' > "$secret_dir/postgres_runtime_password"
          printf '%s\n' 'dbname=nano_aural user=nano_aural_migrator password=ci-migration-owner-password host=postgres' > "$secret_dir/migration_database_dsn"
          printf '%s\n' 'dbname=nano_aural user=nano_aural_runtime password=ci-runtime-password host=postgres' > "$secret_dir/runtime_database_dsn"
          token_digest="$(printf '%s' 'ci-reference-token' | sha256sum | cut -d ' ' -f 1)"
          printf '[{"token_sha256":"%s","subject":"ci","scopes":["assets:write","jobs:submit","jobs:read","jobs:cancel","artifacts:read"],"namespaces":["ci"]}]\n' "$token_digest" > "$secret_dir/token_grants"
      - name: Validate, build, and start the CPU reference topology
        shell: bash
        env:
          NANO_AURAL_MIGRATION_DATABASE_DSN_FILE: ${{ runner.temp }}/nano-aural-secrets/migration_database_dsn
          NANO_AURAL_RUNTIME_DATABASE_DSN_FILE: ${{ runner.temp }}/nano-aural-secrets/runtime_database_dsn
          NANO_AURAL_POSTGRES_MIGRATION_PASSWORD_FILE: ${{ runner.temp }}/nano-aural-secrets/postgres_migration_password
          NANO_AURAL_POSTGRES_RUNTIME_PASSWORD_FILE: ${{ runner.temp }}/nano-aural-secrets/postgres_runtime_password
          NANO_AURAL_TOKEN_GRANTS_FILE: ${{ runner.temp }}/nano-aural-secrets/token_grants
        run: |
          docker compose config --quiet
          docker compose up --build --wait postgres migrate grant-runtime-privileges api cpu-reference-worker
          docker compose ps
          test "$(docker compose exec -T postgres psql -X -A -t -U nano_aural_migrator -d nano_aural -c "SELECT CASE WHEN rolcanlogin AND NOT rolsuper AND NOT rolinherit AND NOT rolcreaterole AND NOT rolcreatedb AND NOT rolreplication AND NOT rolbypassrls THEN 1 ELSE 0 END FROM pg_catalog.pg_roles WHERE rolname='nano_aural_runtime'")" = 1
          docker compose exec -T api python /opt/nano-aural/load_secrets.py python -c "import os, psycopg; c=psycopg.connect(os.environ['NANO_AURAL_DATABASE_DSN']); assert c.info.user == 'nano_aural_runtime'; c.execute('SELECT count(*) FROM public.nano_aural_schema_migrations').fetchone(); c.close()"
          docker compose logs --no-color > "$RUNNER_TEMP/nano-aural-compose.log"
          if grep -F -e 'ci-migration-owner-password' -e 'ci-runtime-password' -e 'ci-reference-token' "$RUNNER_TEMP/nano-aural-compose.log"; then
            echo 'reference logs disclosed a CI canary secret' >&2
            exit 1
          fi
      - name: Tear down reference topology
        if: always()
        env:
          NANO_AURAL_MIGRATION_DATABASE_DSN_FILE: ${{ runner.temp }}/nano-aural-secrets/migration_database_dsn
          NANO_AURAL_RUNTIME_DATABASE_DSN_FILE: ${{ runner.temp }}/nano-aural-secrets/runtime_database_dsn
          NANO_AURAL_POSTGRES_MIGRATION_PASSWORD_FILE: ${{ runner.temp }}/nano-aural-secrets/postgres_migration_password
          NANO_AURAL_POSTGRES_RUNTIME_PASSWORD_FILE: ${{ runner.temp }}/nano-aural-secrets/postgres_runtime_password
          NANO_AURAL_TOKEN_GRANTS_FILE: ${{ runner.temp }}/nano-aural-secrets/token_grants
        run: docker compose down --volumes --remove-orphans

  rtx-4090-evidence-conditional:
    name: RTX 4090 raw evidence collection (not a release Gate)
    if: github.event_name == 'workflow_dispatch' && vars.NANO_AURAL_RUN_4090 == 'true'
    runs-on: [self-hosted, linux, x64, rtx-4090]
    timeout-minutes: 180
    environment: rtx-4090-evidence
    env:
      CONTROLFOLEY_COMFYUI_GPU_CONFIG: ${{ secrets.CONTROLFOLEY_COMFYUI_GPU_CONFIG }}
      CONTROLFOLEY_COMFYUI_REMOTE_GPU_CONFIG: ${{ secrets.CONTROLFOLEY_COMFYUI_REMOTE_GPU_CONFIG }}
      CONTROLFOLEY_P2B_GPU_CONFIG: ${{ secrets.CONTROLFOLEY_P2B_GPU_CONFIG }}
      CONTROLFOLEY_P3D_GPU_CONFIG: ${{ secrets.CONTROLFOLEY_P3D_GPU_CONFIG }}
      CONTROLFOLEY_P4A_GPU_CONFIG: ${{ secrets.CONTROLFOLEY_P4A_GPU_CONFIG }}
      CONTROLFOLEY_P4B_GPU_CONFIG: ${{ secrets.CONTROLFOLEY_P4B_GPU_CONFIG }}
      CONTROLFOLEY_P4C_GPU_CONFIG: ${{ secrets.CONTROLFOLEY_P4C_GPU_CONFIG }}
      CONTROLFOLEY_P4D_GPU_CONFIG: ${{ secrets.CONTROLFOLEY_P4D_GPU_CONFIG }}
      CONTROLFOLEY_SOURCE_DIR: ${{ secrets.CONTROLFOLEY_SOURCE_DIR }}
      CONTROLFOLEY_WEIGHTS_DIR: ${{ secrets.CONTROLFOLEY_WEIGHTS_DIR }}
      HF_HOME: ${{ secrets.CONTROLFOLEY_HF_HOME }}
      NANO_AURAL_4090_PYTHON: ${{ secrets.NANO_AURAL_4090_PYTHON }}
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Require a pre-provisioned sealed evidence environment
        shell: bash
        run: |
          for name in \
            CONTROLFOLEY_COMFYUI_GPU_CONFIG \
            CONTROLFOLEY_COMFYUI_REMOTE_GPU_CONFIG \
            CONTROLFOLEY_P2B_GPU_CONFIG \
            CONTROLFOLEY_P3D_GPU_CONFIG \
            CONTROLFOLEY_P4A_GPU_CONFIG \
            CONTROLFOLEY_P4B_GPU_CONFIG \
            CONTROLFOLEY_P4C_GPU_CONFIG \
            CONTROLFOLEY_P4D_GPU_CONFIG \
            CONTROLFOLEY_SOURCE_DIR \
            CONTROLFOLEY_WEIGHTS_DIR \
            HF_HOME \
            NANO_AURAL_4090_PYTHON
          do
            test -n "${!name}"
          done
          test -x "$NANO_AURAL_4090_PYTHON"
          "$NANO_AURAL_4090_PYTHON" -c "import pytest, torch; assert torch.cuda.is_available(); assert torch.cuda.get_device_name(0) == 'NVIDIA GeForce RTX 4090'"
      - name: Collect conditional GPU test observations
        run: '"$NANO_AURAL_4090_PYTHON" -m pytest -q -rs -m "gpu and controlfoley"'
      - name: Preserve the evidence boundary
        run: >-
          echo 'This job collects raw conditional observations only. Independent
          review of every runbook is still required; skips are not Gate passes.'
