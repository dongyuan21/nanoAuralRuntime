name: Apply security metadata UTF-8 repair

on:
  push:
    branches:
      - fix/recovery-document-anchors
    paths:
      - .github/workflows/apply-security-metadata-utf8.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/recovery-document-anchors
          fetch-depth: 0
      - name: Apply reviewed patch and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/patches/fix-security-metadata-utf8.patch
          git apply .github/patches/fix-security-metadata-utf8.patch
          rm .github/patches/fix-security-metadata-utf8.patch
          rm .github/workflows/apply-security-metadata-utf8.yml
          rmdir .github/patches 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: audit UTF-8 metadata in security validation"
          git push origin HEAD:fix/recovery-document-anchors
