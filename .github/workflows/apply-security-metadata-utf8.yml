name: Apply security metadata UTF-8 repair

on:
  push:
    branches:
      - fix/recovery-document-anchors
    paths:
      - .github/workflows/apply-security-metadata-utf8.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/recovery-document-anchors
          fetch-depth: 0
      - name: Apply reviewed edit and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/release_security_audit.py")
          text = path.read_text(encoding="utf-8")
          replacements = (
              (
                  "from email.parser import BytesParser\n",
                  "from email.parser import BytesParser, Parser\n",
              ),
              (
                  "message = BytesParser(policy=policy.compat32).parsebytes(payload)",
                  'message = Parser(policy=policy.compat32).parsestr(payload.decode("utf-8"))',
              ),
              (
                  "except (TypeError, ValueError):\n        raise ArtifactValidationError(display, kind + \".metadata_schema\") from None",
                  "except (UnicodeDecodeError, TypeError, ValueError):\n        raise ArtifactValidationError(display, kind + \".metadata_schema\") from None",
              ),
          )
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"security metadata audit source shape changed: {old!r}")
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          PY
          rm .github/patches/fix-security-metadata-utf8.patch
          rm .github/workflows/apply-security-metadata-utf8.yml
          rmdir .github/patches 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: audit UTF-8 metadata in security validation"
          git push origin HEAD:fix/recovery-document-anchors
